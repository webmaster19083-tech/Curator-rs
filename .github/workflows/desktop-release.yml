name: Curator release artifacts

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Keep code validation single-source and cheap. Platform jobs consume only a
  # green workspace instead of repeating tests while they race to upload.
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux Tauri build libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Locked workspace check
        run: cargo check --workspace --all-targets --locked
      - name: Strict workspace Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Locked workspace tests
        run: cargo test --workspace --locked
      - name: Browser and JavaScript tests
        run: |
          node --test tests/*.test.js
          node --check static/oobe.js
          node --check viewer/static/app.js

  windows-host-viewer:
    needs: validate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        product: [host, viewer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@2
      - name: Build current-user installers
        shell: pwsh
        run: |
          $dir = if ('${{ matrix.product }}' -eq 'host') { 'desktop' } else { 'viewer' }
          Push-Location $dir
          tauri build --config tauri.windows.current-user.conf.json --bundles nsis
          Pop-Location
          New-Item -ItemType Directory -Force artifacts\windows\${{ matrix.product }}\current-user | Out-Null
          Copy-Item target\release\bundle\nsis\*.exe artifacts\windows\${{ matrix.product }}\current-user -ErrorAction Stop
      - name: Build all-users installers
        shell: pwsh
        run: |
          $dir = if ('${{ matrix.product }}' -eq 'host') { 'desktop' } else { 'viewer' }
          Push-Location $dir
          tauri build --config tauri.windows.all-users.conf.json --bundles nsis
          Pop-Location
          New-Item -ItemType Directory -Force artifacts\windows\${{ matrix.product }}\all-users | Out-Null
          Copy-Item target\release\bundle\nsis\*.exe artifacts\windows\${{ matrix.product }}\all-users -ErrorAction Stop
      - name: Build standard MSI package
        shell: pwsh
        run: |
          $dir = if ('${{ matrix.product }}' -eq 'host') { 'desktop' } else { 'viewer' }
          Push-Location $dir
          tauri build --bundles msi
          Pop-Location
          New-Item -ItemType Directory -Force artifacts\windows\${{ matrix.product }}\msi | Out-Null
          Copy-Item target\release\bundle\msi\*.msi artifacts\windows\${{ matrix.product }}\msi -ErrorAction Stop
      - uses: actions/upload-artifact@v4
        with:
          name: curator-windows-${{ matrix.product }}
          # Preserve the product directory inside the aggregate download so
          # same-named NSIS/MSI outputs cannot overwrite another edition.
          path: artifacts/windows/
          if-no-files-found: error

  windows-server:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Build Server executable
        shell: pwsh
        run: |
          cargo build --release --locked --bin curator
          .\target\release\curator.exe --docs | Out-Null
          Get-ChildItem packaging\windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "PowerShell parse error in $($_.FullName): $($parseErrors -join '; ')" }
          }
      - name: Build scoped Server installers
        shell: pwsh
        run: |
          .\packaging\windows\build-server-installers.ps1 `
            -ServerBinary target\release\curator.exe `
            -OutputDirectory artifacts\windows\server
      - uses: actions/upload-artifact@v4
        with:
          name: curator-windows-server
          path: artifacts/windows/
          if-no-files-found: error

  linux:
    needs: validate
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        product: [server, host, viewer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux Tauri libraries
        if: matrix.product != 'server'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Build Server Debian package and portable archive
        if: matrix.product == 'server'
        run: |
          cargo build --release --locked --bin curator
          target/release/curator --docs >/dev/null
          sh packaging/linux/build-server-deb.sh target/release/curator artifacts/linux
          dpkg-deb --contents artifacts/linux/curator-server_*.deb | grep -q 'usr/lib/curator/static/index.html'
          tar -tzf artifacts/linux/curator-server-*-linux-x86_64.tar.gz | grep -q 'install-current-user.sh'
          bash -n packaging/linux/*.sh
      - name: Install Tauri CLI
        if: matrix.product != 'server'
        run: npm install --global @tauri-apps/cli@2
      - name: Build Host Debian package and portable AppImage
        if: matrix.product == 'host'
        run: |
          cd desktop
          tauri build --bundles deb,appimage
          mkdir -p ../artifacts/linux/host
          cp ../target/release/bundle/deb/*.deb ../artifacts/linux/host/
          cp ../target/release/bundle/appimage/*.AppImage ../artifacts/linux/host/
      - name: Build Viewer Debian package and portable AppImage
        if: matrix.product == 'viewer'
        run: |
          cd viewer
          tauri build --bundles deb,appimage
          mkdir -p ../artifacts/linux/viewer
          cp ../target/release/bundle/deb/*.deb ../artifacts/linux/viewer/
          cp ../target/release/bundle/appimage/*.AppImage ../artifacts/linux/viewer/
      - uses: actions/upload-artifact@v4
        with:
          name: curator-linux-${{ matrix.product }}
          path: artifacts/linux/
          if-no-files-found: error

  macos:
    needs: validate
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            mach_arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            mach_arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build and ad-hoc sign Server
        run: |
          cargo build --release --locked --target ${{ matrix.target }} --bin curator
          codesign --force --sign - target/${{ matrix.target }}/release/curator
          codesign --verify --strict --verbose=2 target/${{ matrix.target }}/release/curator
          lipo -archs target/${{ matrix.target }}/release/curator | tr ' ' '\n' | grep -Fx '${{ matrix.mach_arch }}'
          target/${{ matrix.target }}/release/curator --docs >/dev/null
          plutil -lint packaging/macos/tech.webmaster19083.curator.server.plist
          plutil -lint packaging/macos/tech.webmaster19083.curator.server.user.plist
          mkdir -p artifacts/macos/${{ matrix.target }}
          sh packaging/macos/build-server-pkg.sh target/${{ matrix.target }}/release/curator artifacts/macos/${{ matrix.target }}/curator-server.pkg
          sh packaging/macos/build-server-user-archive.sh target/${{ matrix.target }}/release/curator artifacts/macos/${{ matrix.target }}/curator-server-current-user.tar.gz
          pkgutil --payload-files artifacts/macos/${{ matrix.target }}/curator-server.pkg | grep -q 'static/index.html'
          tar -tzf artifacts/macos/${{ matrix.target }}/curator-server-current-user.tar.gz | grep -q 'install-current-user.sh'
      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@2
      - name: Build, ad-hoc sign, and validate Host and Viewer DMGs
        run: |
          for product in desktop viewer; do
            (cd "$product" && tauri build --target ${{ matrix.target }} --bundles app)
          done
          host_app=target/${{ matrix.target }}/release/bundle/macos/Curator.app
          viewer_app='target/${{ matrix.target }}/release/bundle/macos/Curator Viewer.app'
          sh packaging/macos/build-dmg.sh "$host_app" artifacts/macos/${{ matrix.target }}/
          sh packaging/macos/verify-app.sh "$host_app" tech.webmaster19083.curator ${{ matrix.mach_arch }}
          sh packaging/macos/build-dmg.sh "$viewer_app" artifacts/macos/${{ matrix.target }}/
          sh packaging/macos/verify-app.sh "$viewer_app" tech.webmaster19083.curator.viewer ${{ matrix.mach_arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: curator-macos-${{ matrix.target }}
          # Keep the target directory in every artifact; the aggregate
          # release job deliberately merges only disjoint paths.
          path: artifacts/macos/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-host-viewer, windows-server, linux, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Attach completed matrix artifacts once
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release-artifacts/**
