name: Desktop releases
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop -> target
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust check
        run: cargo check --all-targets
      - name: Rust clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Core tests
        run: cargo test --locked
      - name: Frontend tests
        run: node --test tests/*.test.js
      - name: Install desktop CLI
        run: npm install --global @tauri-apps/cli@2
      - name: Build native application and installer
        working-directory: desktop
        run: tauri build --target ${{ matrix.target }} --bundles "${{ matrix.bundles }}"
      - uses: actions/upload-artifact@v4
        with:
          name: curator-${{ matrix.target }}
          path: |
            desktop/target/${{ matrix.target }}/release/bundle/**/*.exe
            desktop/target/${{ matrix.target }}/release/bundle/**/*.msi
            desktop/target/${{ matrix.target }}/release/bundle/**/*.deb
            desktop/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            desktop/target/${{ matrix.target }}/release/bundle/**/*.dmg
          if-no-files-found: error
      - name: Attach installers to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            desktop/target/${{ matrix.target }}/release/bundle/**/*.exe
            desktop/target/${{ matrix.target }}/release/bundle/**/*.msi
            desktop/target/${{ matrix.target }}/release/bundle/**/*.deb
            desktop/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            desktop/target/${{ matrix.target }}/release/bundle/**/*.dmg
