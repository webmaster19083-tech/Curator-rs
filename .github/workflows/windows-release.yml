name: Windows Release Build

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      # curator.exe loads static/ from disk next to it at runtime (it's served
      # via tower_http::ServeDir, not embedded like DOCS.txt is) — ship the exe
      # alone and the app opens to a 404. Package both together.
      - name: Package release
        shell: pwsh
        run: |
          $dest = "dist/curator-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/curator.exe" -Destination $dest
          Copy-Item -Recurse "static" -Destination "$dest/static"
          Compress-Archive -Path "$dest/*" -DestinationPath "curator-windows-x86_64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: curator-windows-x86_64
          path: curator-windows-x86_64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: curator-windows-x86_64.zip
