name: Windows desktop validation

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop -> desktop/target
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Desktop Rust format
        run: cargo fmt --manifest-path desktop/Cargo.toml -- --check
      - name: Rust check
        run: cargo check --all-targets --locked
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Locked Rust tests
        run: cargo test --locked
      - name: Browser-page and JavaScript tests
        run: node --test tests/*.test.js
      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@2
      - name: Check desktop host
        run: cargo check --manifest-path desktop/Cargo.toml --locked
      - name: Build MSI and NSIS installers
        working-directory: desktop
        run: tauri build --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: curator-windows-installers
          path: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/msi/*.msi
          if-no-files-found: error
