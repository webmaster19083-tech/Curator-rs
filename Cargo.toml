[package]
name = "curator"
version = "0.1.0"
edition = "2021"
description = "Self-hosted gallery-dl front-end. Organize, view, tag, and rate your collection."

[[bin]]
name = "curator"
path = "src/main.rs"

[dependencies]
# Web framework
axum           = { version = "0.7", features = ["macros"] }
tower          = { version = "0.4", features = ["util"] }
tower-http     = { version = "0.5", features = ["compression-gzip", "fs"] }
tokio          = { version = "1",   features = ["full"] }

# Database
rusqlite       = { version = "0.31", features = ["bundled"] }
r2d2           = "0.8"
r2d2_sqlite    = "0.24"

# Serialization
serde          = { version = "1",    features = ["derive"] }
serde_json     = "1"

# Image thumbnailing
# NOTE: "avif-native" is deliberately omitted — it pulls in dav1d-sys, whose
# transitive dep cpufeatures 0.3.x requires the (still-unstable) edition2024
# Cargo feature and fails to build. jpeg/png/gif/webp/bmp/tiff are all pure
# Rust and cover everything gallery-dl actually produces.
image          = { version = "=0.25.6", default-features = false, features = [
                   "jpeg", "png", "gif", "webp", "bmp", "tiff"] }

# ZIP support remains for legacy archives; it is not exposed as a playback mode.
tempfile       = { version = "3", default-features = false }

# CLI
clap           = { version = "=4.5.61", features = ["derive"] }
clap_lex       = "=1.0.1"

# Logging / tracing
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender     = "0.2"

# Utilities
anyhow         = "1"
chrono         = { version = "0.4",  features = ["serde"] }
dunce          = "1"
rand           = "0.8"
dirs           = "5"
sha1           = "0.10"
hex            = "0.4"
regex          = "1"
once_cell      = "1"
futures        = "0.3"
async-stream   = "0.3"
urlencoding    = "2"
reqwest        = { version = "=0.12.12", default-features = false, features = ["rustls-tls", "stream"] }
walkdir        = "2"
notify         = "8"
tokio-util     = { version = "0.7", features = ["io", "rt"] }

# Transitive-dependency pins — without these, newer releases of these crates
# require a Rust edition/MSRV ahead of the CI toolchain and the build fails
# during dependency resolution (see curator_rs_fixed / build fix notes).
hashbrown      = "=0.15.5"
indexmap       = "=2.11.4"
uuid           = "=1.10.0"
time           = "=0.3.36"
async-compression = "=0.4.28"
compression-codecs = "=0.4.28"
image-webp     = "=0.2.0"

# Platform kill (non-Windows)
[target.'cfg(not(target_os = "windows"))'.dependencies]
libc = "0.2"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true

[profile.dev]
debug = 0
incremental = false
