[package]
name = "curator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "curator"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["compression-full", "fs", "set-header"] }
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "=0.25.6", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = { version = "3", default-features = false }
clap = { version = "=4.5.61", features = ["derive"] }
clap_lex = "=1.0.1"
hashbrown = "=0.15.5"
indexmap = "=2.11.4"
getrandom = "=0.3.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dunce = "1"
rand = "0.8"
dirs = "5"
futures = "0.3"
async-stream = "0.3"
sha1 = "0.10"
hex = "0.4"
regex = "1"
url = "=2.5.0"
percent-encoding = "2"
once_cell = "1"
walkdir = "2"
uuid = "=1.10.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
