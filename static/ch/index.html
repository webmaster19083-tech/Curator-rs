<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cock Hero — Curator</title>
  <link rel="stylesheet" href="ch.css">
</head>
<body>

<!-- ── Setup screen ─────────────────────────────────────────────── -->
<div id="setup-screen" class="screen">
  <div class="setup-card">
    <h1>Cock <span>Hero</span></h1>

    <div class="field-group">
      <label>Tags (comma-separated, all required)</label>
      <input type="text" id="f-tags" placeholder="e.g. nsfw, blonde" autocomplete="off">
    </div>

    <div class="field-row">
      <div class="field-group">
        <label>Media type</label>
        <select id="f-type">
          <option value="image">Images only</option>
          <option value="video">Videos only</option>
          <option value="all">Both</option>
        </select>
      </div>
      <div class="field-group">
        <label>Minimum rating</label>
        <select id="f-min-rating">
          <option value="0">Any</option>
          <option value="1">★ 1+</option>
          <option value="2">★★ 2+</option>
          <option value="3">★★★ 3+</option>
          <option value="4">★★★★ 4+</option>
          <option value="5">★★★★★ 5 only</option>
        </select>
      </div>
    </div>

    <div class="field-row">
      <div class="field-group">
        <label>Interval (seconds)</label>
        <input type="number" id="f-interval" value="5" min="1" max="120" step="0.5">
      </div>
      <div class="field-group">
        <label>Playlist limit</label>
        <input type="number" id="f-limit" value="200" min="10" max="2000" step="10">
      </div>
    </div>

    <div class="field-group">
      <label>Session duration (minutes, 0 = unlimited)</label>
      <input type="number" id="f-duration" value="0" min="0" max="240" step="5">
    </div>

    <div class="toggle-row">
      <label for="f-shuffle">Shuffle playlist</label>
      <label class="toggle">
        <input type="checkbox" id="f-shuffle" checked>
        <span class="toggle-track"></span>
      </label>
    </div>

    <div class="toggle-row">
      <label for="f-beats">Beat sync (audio cue)</label>
      <label class="toggle">
        <input type="checkbox" id="f-beats">
        <span class="toggle-track"></span>
      </label>
    </div>

    <p id="setup-error" class="setup-error"></p>

    <button class="btn-start" id="btn-start">Start Session</button>
  </div>
</div>

<!-- ── Session screen ───────────────────────────────────────────── -->
<div id="session-screen" class="screen">

  <div id="media-wrap">
    <img id="media-img" alt="" draggable="false">
    <video id="media-vid" playsinline muted loop></video>
  </div>

  <!-- Countdown overlay -->
  <div id="countdown-overlay" style="display:none">
    <div id="countdown-number">3</div>
    <div id="countdown-label">Get ready</div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-top">
      <div class="hud-badge" id="hud-timer">00:00</div>
      <div class="hud-badge" id="hud-pace">—</div>
      <div class="hud-badge" id="hud-count"></div>
    </div>
    <div class="hud-bottom">
      <button class="hud-btn"        id="btn-pause">⏸ Pause</button>
      <button class="hud-btn"        id="btn-skip">⏭ Skip</button>
      <button class="hud-btn danger" id="btn-end">■ End</button>
    </div>
  </div>

  <!-- Pace flash -->
  <div id="pace-flash" aria-hidden="true">
    <span class="pace-text" id="pace-flash-text"></span>
  </div>

  <!-- Progress bar -->
  <div id="progress-bar-wrap">
    <div id="progress-bar"></div>
  </div>

  <!-- End overlay -->
  <div id="end-overlay">
    <h2>Session Complete</h2>
    <div class="end-stats" id="end-stats"></div>
    <button class="btn-again" id="btn-again">New Session</button>
  </div>

</div>

<script src="ch.js"></script>
</body>
</html>
